<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark background container -->
  <rect width="64" height="64" rx="16" fill="#0B0F17"/>
  <rect width="64" height="64" rx="16" stroke="#6B8E23" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Bamboo Stem (Left Vertical Bar of 'P') -->
  <rect x="18" y="14" width="8" height="36" rx="3" fill="#6B8E23"/>
  <!-- Bamboo nodes -->
  <line x1="16" y1="26" x2="28" y2="26" stroke="#0B0F17" stroke-width="2.5"/>
  <line x1="16" y1="38" x2="28" y2="38" stroke="#0B0F17" stroke-width="2.5"/>
  
  <!-- 'P' Loop with Gold Accent -->
  <path d="M 26 14 H 38 C 45 14 45 28 38 28 H 26" stroke="#D4AF37" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Bamboo Leaf accent top right -->
  <path d="M 38 10 C 44 8 48 12 46 18 C 42 18 38 14 38 10 Z" fill="#A3B18A"/>
</svg>